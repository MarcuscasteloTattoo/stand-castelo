<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estandes Tatuador de Elite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Barlow:wght@400;500&display=swap">
<style>
/* layout: one full-width 3D stage, a slim toolbar above, specs below */
:root{--bg:#eef0f2;--fg:#1d1f22;--muted:#5f656d;--line:#cfd3d8;--chip:#ffffff;--gold:#b88a1e;--ui:"Barlow",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#e9ebee;--muted:#9aa1aa;--line:#33373d;--chip:#1f2226;--gold:#e0b44a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#e9ebee;--muted:#9aa1aa;--line:#33373d;--chip:#1f2226;--gold:#e0b44a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h1{font-size:22px;font-weight:500;margin:0;text-wrap:balance}
h1 span{color:var(--gold)}
.tools{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 14px var(--ui);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{width:100%;aspect-ratio:16/9;max-height:72vh;min-height:320px;border-radius:10px;overflow:hidden;background:#e4e6e9;position:relative}
#stage canvas{display:block}
.specs{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;margin:0;padding:0;list-style:none}
.specs b{color:var(--fg);font-weight:500}
*{box-sizing:border-box}body{margin:0}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Estandes <span>Tatuador de Elite</span></h1>
<div class="tools" role="group" aria-label="Vistas">
<button id="v-iso" aria-pressed="true">Isométrica</button>
<button id="v-front" aria-pressed="false">Frente 6 m</button>
<button id="v-right" aria-pressed="false">Lateral 4 m</button>
<button id="v-back" aria-pressed="false">Fundo 3 m</button>
<button id="v-top" aria-pressed="false">Planta</button>
</div>
</header>
<div id="stage" aria-label="Modelo 3D dos estandes em L"></div>
<ul class="specs">
<li><b>18 m²</b> em L, 3 módulos de 3 × 2 m</li>
<li><b>2,70 m</b> de altura, testeira de 0,50 m</li>
<li><b>10 placas</b> de 1 × 2,20 m</li>
<li>Testeiras pretas: 2 logos na frente, 1 na lateral, 1 no fundo, com bandeiras BR, EUA e UE</li>
<li>Arraste para girar, role para aproximar</li>
</ul>
</div>

controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-0.02;
scene.add(new THREE.HemisphereLight(0xffffff,0xb9bcc0,0.65));
const sun=new THREE.DirectionalLight(0xffffff,0.85);sun.position.set(9,13,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0005;
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});
sun.target.position.set(3,0,-2);scene.add(sun,sun.target);
const fillL=new THREE.DirectionalLight(0xffffff,0.35);fillL.position.set(-6,8,-10);scene.add(fillL);
const alu=new THREE.MeshStandardMaterial({color:0xb7bbc1,metalness:0.7,roughness:0.32});
const panel=new THREE.MeshStandardMaterial({color:0xf3f3f1,roughness:0.92});
const black=new THREE.MeshStandardMaterial({color:0x0e0e0f,roughness:0.55});
const carpet=new THREE.MeshStandardMaterial({color:0x5a5d61,roughness:1});
const ground=new THREE.MeshStandardMaterial({color:0xd6d8db,roughness:0.95});
const lampBody=new THREE.MeshStandardMaterial({color:0xdfe1e4,metalness:0.5,roughness:0.4});
const lampFace=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff6e0,emissiveIntensity:1.4});
function box(w,h,d,m,x,y,z,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o;}
const g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),ground);g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
box(6,0.02,2,carpet,3,0.01,-1,false);box(3,0.02,2,carpet,4.5,0.01,-3,false);
const T=0.03,PR=0.045;
for(let i=0;i<6;i++)box(1-PR,2.2,T,panel,i+0.5,1.1,-2);
for(let i=0;i<2;i++)box(T,2.2,1-PR,panel,0,1.1,-(i+0.5));
for(let i=2;i<4;i++)box(T,2.2,1-PR,panel,3,1.1,-(i+0.5));
for(let x=0;x<=6;x++)box(PR,2.2,PR+0.02,alu,x,1.1,-2);
for(let y=0;y<=2;y++)box(PR+0.02,2.2,PR,alu,0,1.1,-y);
for(let y=2;y<=4;y++)box(PR+0.02,2.2,PR,alu,3,1.1,-y);
[[0,0],[3,0],[6,0],[0,2],[3,2],[6,2],[3,4],[6,4]].forEach(([X,Y])=>{box(0.06,2.7,0.06,alu,X,1.35,-Y);box(0.14,0.012,0.14,alu,X,0.006,-Y);});
const beamX=(Y,a,b,h)=>box(b-a,0.045,0.045,alu,(a+b)/2,h,-Y);
const beamY=(X,a,b,h)=>box(0.045,0.045,b-a,alu,X,h,-(a+b)/2);
[2.2,2.7].forEach(h=>{beamX(0,0,6,h);beamX(2,0,6,h);beamX(4,3,6,h);beamY(0,0,2,h);beamY(6,0,4,h);beamY(3,2,4,h);});
beamX(2,0,6,0.02);beamY(0,0,2,0.02);beamY(3,2,4,0.02);
function lamp(px,pz,tx,tz){
 box(0.025,0.025,0.3,alu,px,2.74,pz);
 const head=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.09,0.14),lampBody);b.castShadow=true;head.add(b);
 const f=new THREE.Mesh(new THREE.PlaneGeometry(0.26,0.1),lampFace);f.rotation.x=Math.PI/2;f.position.y=-0.046;head.add(f);
 head.position.set(px,2.66,pz);head.lookAt(tx,0,tz);head.rotateX(-Math.PI/2);scene.add(head);
 const s=new THREE.SpotLight(0xfff3dc,1.6,7,Math.PI/5,0.6,1.6);s.position.set(px,2.6,pz);s.target.position.set(tx,0,tz);scene.add(s,s.target);
}
lamp(1.5,-0.25,1.5,-1.3);lamp(4.5,-0.25,4.5,-1.3);lamp(4.5,-3.75,4.5,-2.9);lamp(5.75,-1,5,-1);lamp(5.75,-3,5,-3);

const PXM=800,FH=400;
function drawBR(x,X,Y,w,h){x.save();x.fillStyle='#009c3b';x.fillRect(X,Y,w,h);x.fillStyle='#ffdf00';x.beginPath();x.moveTo(X+w*0.08,Y+h/2);x.lineTo(X+w/2,Y+h*0.1);x.lineTo(X+w*0.92,Y+h/2);x.lineTo(X+w/2,Y+h*0.9);x.closePath();x.fill();x.fillStyle='#002776';x.beginPath();x.arc(X+w/2,Y+h/2,h*0.25,0,Math.PI*2);x.fill();x.strokeStyle='#ffffff';x.lineWidth=h*0.05;x.beginPath();x.arc(X+w/2-h*0.05,Y+h*0.95,h*0.5,-Math.PI*0.68,-Math.PI*0.3);x.stroke();x.restore();}
function drawUS(x,X,Y,w,h){x.save();const sh=h/13;for(let i=0;i<13;i++){x.fillStyle=i%2?'#ffffff':'#b22234';x.fillRect(X,Y+i*sh,w,sh+0.5);}x.fillStyle='#3c3b6e';const cw=w*0.4,ch=sh*7;x.fillRect(X,Y,cw,ch);x.fillStyle='#ffffff';for(let r=0;r<5;r++)for(let c=0;c<6;c++){x.beginPath();x.arc(X+cw*(c+0.5)/6,Y+ch*(r+0.5)/5,Math.max(0.6,sh*0.22),0,Math.PI*2);x.fill();}x.restore();}
function drawEU(x,X,Y,w,h){x.save();x.fillStyle='#003399';x.fillRect(X,Y,w,h);x.fillStyle='#ffcc00';const cx=X+w/2,cy=Y+h/2,R=h/3,r=h/18;for(let i=0;i<12;i++){const a=i*Math.PI/6,sx=cx+R*Math.cos(a),sy=cy+R*Math.sin(a);x.beginPath();for(let k=0;k<10;k++){const rr=k%2?r*0.42:r,t=-Math.PI/2+k*Math.PI/5;x.lineTo(sx+rr*Math.cos(t),sy+rr*Math.sin(t));}x.closePath();x.fill();}x.restore();}
function fasciaTexture(lenM,centers,img){
 const c=document.createElement('canvas');c.width=lenM*PXM;c.height=FH;const x=c.getContext('2d');
 x.fillStyle='#0e0e0f';x.fillRect(0,0,c.width,c.height);
 const s=7.2,bw=244*s,bh=30*s;
 centers.forEach(cm=>{
  const bx=cm*PXM-bw/2,by=(FH-bh)/2;
  x.imageSmoothingQuality='high';
  x.drawImage(img,bx-1*s,by-1*s,24*s,33*s);
  const title='TATUADOR DE ELITE',tl=bx+28*s,tr=bx+244*s;
  x.font='400 100px "Open Sans", "Segoe UI", Arial, sans-serif';
  let f=100*(tr-tl)/x.measureText(title).width;
  x.font=`400 ${f}px "Open Sans", "Segoe UI", Arial, sans-serif`;
  x.fillStyle='#ffffff';x.textBaseline='alphabetic';x.textAlign='left';
  x.fillText(title,tl,by+20*s);
  const sub='MARKETING PARA TATUADORES';
  x.font='400 100px "Open Sans", "Segoe UI", Arial, sans-serif';
  let f2=100*(110*s)/x.measureText(sub).width;
  x.font=`400 ${f2}px "Open Sans", "Segoe UI", Arial, sans-serif`;
  x.fillStyle='#cfcfcf';x.textAlign='right';x.fillText(sub,bx+204*s,by+29.5*s);
  const fy=by+24*s,fw=10*s,fh=7*s;
  drawBR(x,bx+212*s,fy,fw,fh);drawUS(x,bx+223.5*s,fy,fw,fh);drawEU(x,bx+235*s,fy,fw,fh);
 });
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
 return new THREE.MeshStandardMaterial({map:t,roughness:0.55});
}
function fascia(w,h,d,x,y,z,face,mat){const mats=[black,black,black,black,black,black];mats[face]=mat;const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);}
function buildFascias(img){
 fascia(6,0.5,0.025,3,2.45,0.035,4,fasciaTexture(6,[1.5,4.5],img));
 fascia(0.025,0.5,4,6.035,2.45,-2,0,fasciaTexture(4,[2],img));
 fascia(3,0.5,0.025,4.5,2.45,-4.035,5,fasciaTexture(3,[1.5],img));
}
const img=new Image();
const fontReady=Promise.race([document.fonts?document.fonts.load('400 100px "Open Sans"'):Promise.resolve(),new Promise(r=>setTimeout(r,2500))]);
const imgReady=new Promise(r=>{img.onload=r;img.onerror=r;img.src=PHOENIX;});
Promise.all([fontReady,imgReady]).then(()=>buildFascias(img));

const views={iso:{p:[11,7.2,7.5],t:[3,1.1,-2]},front:{p:[3,1.8,11.5],t:[3,1.4,-2]},right:{p:[15,1.8,-2],t:[3,1.4,-2]},back:{p:[4.5,1.8,-15],t:[4.5,1.4,-2]},top:{p:[3,17,-2.001],t:[3,0,-2]}};
function setView(k){const v=views[k];camera.position.set(...v.p);controls.target.set(...v.t);controls.update();
 Object.keys(views).forEach(n=>document.getElementById('v-'+n).setAttribute('aria-pressed',n===k?'true':'false'));}
setView('iso');
Object.keys(views).forEach(k=>document.getElementById('v-'+k).addEventListener('click',()=>setView(k)));
(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);})();
new ResizeObserver(()=>{camera.aspect=W()/H();camera.updateProjectionMatrix();renderer.setSize(W(),H());}).observe(stage);
</script>
